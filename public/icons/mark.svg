<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="maNOWj GeoIntel">
  <!--
    The maNOWj GeoIntel mark (November 2026): a location pin circled by an
    orbit, with a teal "satellite" on it - geo intelligence in one picture.

    Built for the size it is actually seen at. At 16px (a browser tab) the
    white pin on violet and the teal dot are what read; the orbit is a
    supporting line that only resolves from 32px up, which is why the pin
    and dot carry the identity on their own.

    The orbit passes BEHIND the pin: the pin carries a tile-coloured outline
    that cuts the ring where they cross, so the two read as separate objects
    rather than one tangled shape.
  -->
  <defs>
    <linearGradient id="tile" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#8f82ff"/>
      <stop offset="0.5" stop-color="#6d5bff"/>
      <stop offset="1" stop-color="#4f3fe0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#tile)"/>
  <rect width="512" height="512" rx="116" fill="url(#shine)"/>
  <ellipse cx="256" cy="300" rx="190" ry="66" transform="rotate(-18 256 300)" fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="22"/>
  <path d="M256 438 C214 372 134 312 134 220 A122 122 0 1 1 378 220 C378 312 298 372 256 438 Z" fill="#ffffff" stroke="#5b4cf0" stroke-width="20" stroke-linejoin="round"/>
  <circle cx="256" cy="218" r="48" fill="#5b4cf0"/>
  <circle cx="412" cy="248" r="30" fill="#2dd4bf" stroke="#ffffff" stroke-width="12"/>
</svg>
